# Include this file inside the existing HTTPS `server` block. The companion
# files must be installed under /etc/nginx/codex/.
# Each location overrides any inherited host access log so query strings,
# Referer, and User-Agent fields cannot be written by a parent format.

# Increase the response-header buffer for every proxy location in this server.
# The snippet contains no location, upstream, header, cache, log, or timeout policy.
include /etc/nginx/codex/sub2api-logout-location.conf;

location = /codex {
    access_log /var/log/sub2api-codex-control/nginx-access.log codex_control_json;
    include /etc/nginx/codex/browser-security-headers.conf;
    return 308 /codex/;
}

location ^~ /codex/ {
    access_log /var/log/sub2api-codex-control/nginx-access.log codex_control_json;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_pass http://codex_control_pwa;
    include /etc/nginx/codex/hide-upstream-security-headers.conf;
    include /etc/nginx/codex/browser-security-headers.conf;
}

location = /codex-api {
    access_log /var/log/sub2api-codex-control/nginx-access.log codex_control_json;
    include /etc/nginx/codex/api-security-headers.conf;
    return 308 /codex-api/;
}

# Metrics are scraped through the loopback API port, never through the public
# same-origin surface.
location ^~ /codex-api/internal/ {
    access_log /var/log/sub2api-codex-control/nginx-access.log codex_control_json;
    include /etc/nginx/codex/api-security-headers.conf;
    return 404;
}

location ^~ /codex-api/ {
    access_log /var/log/sub2api-codex-control/nginx-access.log codex_control_json;
    limit_req zone=codex_control_api_per_ip burst=40 nodelay;
    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 65s;
    proxy_send_timeout 30s;
    proxy_pass http://codex_control_api/;
    include /etc/nginx/codex/hide-upstream-security-headers.conf;
    proxy_hide_header Cache-Control;
    proxy_hide_header Pragma;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Origin;
    include /etc/nginx/codex/api-security-headers.conf;
}

location = /codex-ws {
    access_log /var/log/sub2api-codex-control/nginx-access.log codex_control_json;
    include /etc/nginx/codex/api-security-headers.conf;
    return 404;
}

location = /codex-ws/browser {
    access_log /var/log/sub2api-codex-control/nginx-access.log codex_control_json;
    set $codex_expected_origin "$scheme://$http_host";
    if ($http_origin != $codex_expected_origin) {
        return 403;
    }
    limit_conn codex_control_ws_per_ip 20;
    client_max_body_size 256k;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $codex_control_connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    # Browser sessions can be idle and expire after at most 10 minutes.
    proxy_read_timeout 660s;
    proxy_send_timeout 30s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_pass http://codex_control_api/ws/browser;
    include /etc/nginx/codex/hide-upstream-security-headers.conf;
    include /etc/nginx/codex/api-security-headers.conf;
}

location = /codex-ws/device {
    access_log /var/log/sub2api-codex-control/nginx-access.log codex_control_json;
    limit_conn codex_control_ws_per_ip 10;
    client_max_body_size 256k;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $codex_control_connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
    proxy_send_timeout 30s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_pass http://codex_control_device_api/ws/device;
    include /etc/nginx/codex/hide-upstream-security-headers.conf;
    include /etc/nginx/codex/api-security-headers.conf;
}

location ^~ /codex-ws/ {
    access_log /var/log/sub2api-codex-control/nginx-access.log codex_control_json;
    include /etc/nginx/codex/api-security-headers.conf;
    return 404;
}

# This final prefix guard keeps adjacent or malformed /codex* routes from
# inheriting a host-level access log that may include secret-bearing fields.
location ^~ /codex {
    access_log /var/log/sub2api-codex-control/nginx-access.log codex_control_json;
    include /etc/nginx/codex/api-security-headers.conf;
    return 404;
}
