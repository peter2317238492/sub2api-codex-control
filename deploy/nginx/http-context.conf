# Include this file once in the existing Nginx `http` block. These loopback
# ports must match deploy/docker-compose/.env.
upstream codex_control_api {
    server 127.0.0.1:18090 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Keep the long-lived device socket on the production replica while HTTP and
# browser traffic continue through codex_control_api.
upstream codex_control_device_api {
    server 127.0.0.1:18093 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream codex_control_pwa {
    server 127.0.0.1:18091 max_fails=3 fail_timeout=10s;
    keepalive 8;
}

map $http_upgrade $codex_control_connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=codex_control_api_per_ip:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=codex_control_ws_per_ip:10m;
limit_req_status 429;
limit_conn_status 429;

log_format codex_control_json escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time","upstream_status":"$upstream_status",'
    '"upstream_addr":"$upstream_addr",'
    '"request_id":"$upstream_http_x_request_id"}';
