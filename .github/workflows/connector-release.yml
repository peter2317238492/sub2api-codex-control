name: Connector protected release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: connector-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_DIR: dist/connector
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  source-only-guard:
    name: Binary release disabled until the formal package gates close
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed before any signing or release write
        run: |
          echo "Connector binary publication remains disabled until protected signing environments and package gates are complete." >&2
          exit 1

  build:
    name: Test and build reproducible candidates
    needs: source-only-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the immutable tag candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install the pinned Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          cache: false

      - name: Verify public source and licensing before any build
        run: |
          python3 scripts/check-public-tree.py
          python3 scripts/check-licenses.py

      - name: Validate release tooling and tamper rejection
        run: python3 -m unittest discover -s connector/release/tests -v

      - name: Build every candidate twice
        shell: bash
        run: |
          set -euo pipefail
          source_date_epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          repository="https://github.com/${GITHUB_REPOSITORY}"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/connector-release.yml@${GITHUB_REF}"
          python3 connector/release/release.py prepare \
            --mode release \
            --output "$RELEASE_DIR" \
            --source-commit "$GITHUB_SHA" \
            --source-repository "$repository" \
            --builder-id "$identity" \
            --invocation-id "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            --source-date-epoch "$source_date_epoch"

      - name: Transfer unsigned candidates
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: connector-candidates-${{ github.run_attempt }}
          path: dist/connector
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  native-sign:
    name: Apply Apple signatures and finalize evidence
    needs: build
    runs-on: macos-15
    timeout-minutes: 45
    environment: connector-release-apple
    permissions:
      contents: read
    steps:
      - name: Check out the exact release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install the pinned Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          cache: false

      - name: Receive unsigned candidates
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: connector-candidates-${{ github.run_attempt }}
          path: dist/connector

      - name: Validate unsigned transfer before exposing Apple credentials
        run: python3 connector/release/release.py validate-work-state --output "$RELEASE_DIR"

      - name: Apply Developer ID signatures and notarize
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
          MACOS_EXPECTED_TEAM_ID: ${{ vars.MACOS_EXPECTED_TEAM_ID }}
          MACOS_EXPECTED_SIGNING_IDENTITY: ${{ vars.MACOS_EXPECTED_SIGNING_IDENTITY }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: connector/release/macos-sign-notarize.sh "$RELEASE_DIR"

      - name: Generate per-artifact SBOM and SLSA provenance
        run: python3 connector/release/release.py finalize --output "$RELEASE_DIR"

      - name: Transfer finalized unsigned evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: connector-finalized-${{ github.run_attempt }}
          path: dist/connector
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  attest:
    name: Keylessly sign and verify
    needs: native-sign
    runs-on: macos-15
    timeout-minutes: 20
    environment: connector-release-sigstore
    permissions:
      contents: read
      id-token: write
    env:
      COSIGN_EXPERIMENTAL: "1"
    steps:
      - name: Check out the exact release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install the pinned Sigstore client
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.0.6"

      - name: Receive finalized evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: connector-finalized-${{ github.run_attempt }}
          path: dist/connector

      - name: Validate all evidence and create keyless bundles
        env:
          APPLE_SIGNING_IDENTITY: ${{ vars.MACOS_EXPECTED_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.MACOS_EXPECTED_TEAM_ID }}
        run: |
          python3 connector/release/release.py sign \
            --output "$RELEASE_DIR" \
            --apple-team-id "$APPLE_TEAM_ID" \
            --apple-signing-identity "$APPLE_SIGNING_IDENTITY"

      - name: Verify with externally fixed certificate claims
        env:
          APPLE_SIGNING_IDENTITY: ${{ vars.MACOS_EXPECTED_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.MACOS_EXPECTED_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/connector-release.yml@${GITHUB_REF}"
          python3 connector/release/release.py verify \
            --output "$RELEASE_DIR" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity "$identity" \
            --certificate-github-workflow-sha "$GITHUB_SHA" \
            --certificate-github-workflow-trigger "push" \
            --apple-team-id "$APPLE_TEAM_ID" \
            --apple-signing-identity "$APPLE_SIGNING_IDENTITY"

      - name: Transfer signed and verified assets
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: connector-signed-${{ github.run_attempt }}
          path: dist/connector
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish immutable release
    needs: attest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: connector-release-publish
    permissions:
      contents: write
    steps:
      - name: Receive the signed assets verified by the OIDC job
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: connector-signed-${{ github.run_attempt }}
          path: dist/connector

      - name: Require the remote tag and repository immutability before publication
        env:
          GH_TOKEN: ${{ secrets.IMMUTABLE_RELEASES_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag_object=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")
          object_type=$(printf '%s' "$tag_object" | jq -r .object.type)
          object_sha=$(printf '%s' "$tag_object" | jq -r .object.sha)
          while [ "$object_type" = tag ]; do
            tag_object=$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")
            object_type=$(printf '%s' "$tag_object" | jq -r .object.type)
            object_sha=$(printf '%s' "$tag_object" | jq -r .object.sha)
          done
          test "$object_type" = commit
          test "$object_sha" = "$GITHUB_SHA"
          enabled=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/immutable-releases" \
            --jq .enabled)
          test "$enabled" = "true"

      - name: Publish all assets through an immutable draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          assert_remote_tag() {
            tag_object=$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")
            object_type=$(printf '%s' "$tag_object" | jq -r .object.type)
            object_sha=$(printf '%s' "$tag_object" | jq -r .object.sha)
            while [ "$object_type" = tag ]; do
              tag_object=$(gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")
              object_type=$(printf '%s' "$tag_object" | jq -r .object.type)
              object_sha=$(printf '%s' "$tag_object" | jq -r .object.sha)
            done
            test "$object_type" = commit
            test "$object_sha" = "$GITHUB_SHA"
          }
          assert_remote_tag
          gh release create "$GITHUB_REF_NAME" "$RELEASE_DIR"/* \
            --draft \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --latest=false \
            --title "Connector ${GITHUB_REF_NAME#connector-v}" \
            --notes "Protected Connector release. Verify manifest.json with the exact issuer, workflow identity, source commit, and push trigger documented in connector/release/README.md."
          assert_remote_tag
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest=false
          assert_remote_tag
          immutable=$(gh release view "$GITHUB_REF_NAME" --json isImmutable --jq .isImmutable)
          if [ "$immutable" != "true" ]; then
            echo "::error::Published release is mutable; enable GitHub immutable releases and treat these assets as untrusted."
            exit 1
          fi

  verify-public-release:
    name: Re-download and verify the public immutable release
    needs: publish
    runs-on: macos-15
    timeout-minutes: 20
    environment: connector-release-sigstore
    permissions:
      contents: read
    steps:
      - name: Check out the independently trusted verifier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install the pinned Sigstore client
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.0.6"

      - name: Download every asset without authentication and recheck the public tag
        id: public
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$RELEASE_TAG" =~ ^connector-v[0-9A-Za-z.-]+$ ]]
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]

          remote_tags=$(git ls-remote --tags \
            "https://github.com/${RELEASE_REPOSITORY}.git" \
            "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}")
          direct=$(printf '%s\n' "$remote_tags" | awk -v ref="refs/tags/${RELEASE_TAG}" '$2 == ref {print $1}')
          peeled=$(printf '%s\n' "$remote_tags" | awk -v ref="refs/tags/${RELEASE_TAG}^{}" '$2 == ref {print $1}')
          test -n "$direct"
          test -n "$peeled"
          test "$direct" != "$peeled"
          test "$peeled" = "$EXPECTED_COMMIT"

          download_dir=$(mktemp -d "$RUNNER_TEMP/connector-public.XXXXXX")
          response="$RUNNER_TEMP/connector-release.json"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            "https://api.github.com/repos/${RELEASE_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            --output "$response"
          jq -e --arg tag "$RELEASE_TAG" '
            .tag_name == $tag and
            .draft == false and
            .prerelease == false and
            .immutable == true and
            (.assets | length > 0) and
            all(.assets[]; .state == "uploaded")
          ' "$response" >/dev/null
          jq -r '.assets[] | [.name, .browser_download_url] | @tsv' "$response" > "$RUNNER_TEMP/connector-assets.tsv"
          while IFS=$'\t' read -r name url; do
            [[ "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
            test "$url" = "https://github.com/${RELEASE_REPOSITORY}/releases/download/${RELEASE_TAG}/${name}"
            test ! -e "$download_dir/$name"
            curl --fail --silent --show-error --location --retry 3 \
              --proto '=https' --tlsv1.2 \
              "$url" --output "$download_dir/$name"
          done < "$RUNNER_TEMP/connector-assets.tsv"
          test "$(find "$download_dir" -type f | wc -l | tr -d ' ')" = "$(jq '.assets | length' "$response")"
          printf 'path=%s\n' "$download_dir" >> "$GITHUB_OUTPUT"

      - name: Verify GitHub's immutable-release attestation for every downloaded asset
        env:
          DOWNLOAD_DIR: ${{ steps.public.outputs.path }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          release_attestation="$RUNNER_TEMP/connector-release-attestation.json"
          gh release verify "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" \
            --format json > "$release_attestation"
          jq -e \
            --arg commit "$GITHUB_SHA" \
            --arg repository "$RELEASE_REPOSITORY" \
            --arg tag "$RELEASE_TAG" '
              .verificationResult.statement
              | .predicate.repository == $repository
                and .predicate.tag == $tag
                and any(.subject[];
                  .uri == ("pkg:github/" + $repository + "@" + $tag)
                  and .digest.sha1 == $commit)
            ' "$release_attestation" >/dev/null
          for asset in "$DOWNLOAD_DIR"/*; do
            gh release verify-asset "$RELEASE_TAG" "$asset" --repo "$RELEASE_REPOSITORY"
          done

      - name: Re-run the fail-closed consumer verifier on the public bytes
        env:
          APPLE_SIGNING_IDENTITY: ${{ vars.MACOS_EXPECTED_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.MACOS_EXPECTED_TEAM_ID }}
          DOWNLOAD_DIR: ${{ steps.public.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/connector-release.yml@${GITHUB_REF}"
          python3 connector/release/release.py verify \
            --output "$DOWNLOAD_DIR" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity "$identity" \
            --certificate-github-workflow-sha "$GITHUB_SHA" \
            --certificate-github-workflow-trigger "push" \
            --apple-team-id "$APPLE_TEAM_ID" \
            --apple-signing-identity "$APPLE_SIGNING_IDENTITY"
