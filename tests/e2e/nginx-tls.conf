worker_processes 1;
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server_tokens off;

    upstream codex_control_api {
        server control-api:8090;
        keepalive 16;
    }

    upstream codex_control_device_api {
        server control-api-replica:8090;
        keepalive 16;
    }

    upstream codex_control_pwa {
        server codex-pwa:8080;
        keepalive 4;
    }

    map $http_upgrade $codex_control_connection_upgrade {
        default upgrade;
        '' close;
    }

    limit_req_zone $binary_remote_addr zone=codex_control_api_per_ip:1m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=codex_control_ws_per_ip:1m;
    limit_req_status 429;
    limit_conn_status 429;

    log_format codex_control_json escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time","upstream_status":"$upstream_status",'
        '"upstream_addr":"$upstream_addr",'
        '"request_id":"$upstream_http_x_request_id"}';

    access_log /dev/stdout combined;

    server {
        listen 8443 ssl;
        server_name 127.0.0.1;

        ssl_certificate /run/e2e-tls/tls.crt;
        ssl_certificate_key /run/e2e-tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;

        include /etc/nginx/codex/server-locations.conf;

        location / {
            return 404;
        }
    }
}
