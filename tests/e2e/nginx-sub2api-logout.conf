worker_processes 1;
pid /tmp/nginx.pid;

error_log /dev/stderr notice;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    access_log off;

    # Both servers use the exact same proxy location include. The response
    # buffer snippet is the only behavioral difference under test.
    server {
        listen 18080;
        server_name _;

        include /etc/nginx/codex/sub2api-logout-location.conf;
        include /etc/nginx/sub2api-proxy-location.conf;
    }

    server {
        listen 18081;
        server_name _;

        include /etc/nginx/sub2api-proxy-location.conf;
    }
}
